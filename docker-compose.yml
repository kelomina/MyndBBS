# ============================================================
# MyndBBS - Docker Compose 閮ㄧ讲閰嶇疆
# 浣跨敤鏂瑰紡:
#   docker compose up -d
#   docker compose logs -f
# ============================================================

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: myndbbs-postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: myndbbs
      POSTGRES_USER: myndbbs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myndbbs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: myndbbs-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Backend API ====================
  backend:
    image: ghcr.io/kelomina/myndbbs-backend:${CORE_IMAGE_TAG:-latest}
    container_name: myndbbs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://myndbbs:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/myndbbs?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY is required}
      NODE_ENV: production
      COOKIE_SECURE: "true"
      PLUGIN_ALLOWLIST_FILE: /app/plugin-releases/allowlist.json
      PLUGIN_MANIFEST_ROOT: /app/plugin-releases
      PLUGIN_CONTROL_URL: ${PLUGIN_CONTROL_URL:-}
      PLUGIN_CONTROL_TOKEN: ${PLUGIN_CONTROL_TOKEN:-}
      PLUGIN_CONFIG_ENCRYPTION_KEY: ${PLUGIN_CONFIG_ENCRYPTION_KEY:-}
    volumes:
      - uploads-data:/app/packages/backend/uploads
      - ${BACKEND_ENV_FILE:-./.env}:/app/packages/backend/.env:ro
      - ${PLUGIN_HOST_DIR:-/opt/myndbbs/plugins}:/app/plugin-releases:ro
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ==================== External plugin supervisor ====================
  # This is the only service allowed to access the Docker socket. The backend
  # service above deliberately has no socket mount.
  plugin-control:
    profiles: [plugins]
    image: ghcr.io/kelomina/myndbbs-plugin-control:${PLUGIN_INFRA_IMAGE_TAG:-latest}
    restart: unless-stopped
    # This file MUST NOT be the backend .env. It contains PLUGIN_RUNTIME_SECRET
    # only; a missing secret file fails closed when the profile is enabled.
    env_file:
      - ${PLUGIN_CONTROL_ENV_FILE:-/opt/myndbbs/secrets/plugin-control.env}
    environment:
      NODE_ENV: production
      PLUGIN_ROOT: /opt/myndbbs/plugins
      # Docker bind source is evaluated on the DAEMON HOST, not in this container.
      PLUGIN_DOCKER_ROOT: ${PLUGIN_HOST_DIR:-/opt/myndbbs/plugins}
      PLUGIN_CONTROL_TOKEN: ${PLUGIN_CONTROL_TOKEN:-}
      PLUGIN_TRUST_KEYS_FILE: /opt/myndbbs/plugin-trust-keys.json
      PLUGIN_DOCKER_TRUST_KEYS_FILE: ${PLUGIN_TRUST_KEYS_HOST_FILE:-/opt/myndbbs/plugin-trust-keys.json}
      PLUGIN_NETWORK: ${PLUGIN_RUNTIME_NETWORK:-myndbbs_plugin_runtime}
      PLUGIN_RUNTIME_IMAGE: ghcr.io/kelomina/myndbbs-plugin-runtime:${PLUGIN_INFRA_IMAGE_TAG:-latest}
    volumes:
      - type: bind
        source: ${PLUGIN_HOST_DIR:-/opt/myndbbs/plugins}
        target: /opt/myndbbs/plugins
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${PLUGIN_TRUST_KEYS_HOST_FILE:-/opt/myndbbs/plugin-trust-keys.json}
        target: /opt/myndbbs/plugin-trust-keys.json
        read_only: true
        bind:
          create_host_path: false
    networks: [default, plugin-runtime]
    # No published port. Backend uses authenticated /v1/plugins/:id/proxy.
    # Candidates receive ONLY plugin-runtime, never default or host networking.

  # ==================== Frontend (Next.js) ====================
  frontend:
    image: ghcr.io/kelomina/myndbbs-frontend:${CORE_IMAGE_TAG:-latest}
    container_name: myndbbs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:3001
      NODE_ENV: production
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:3100:3100"

  # ==================== Meilisearch ====================
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: myndbbs-meilisearch
    restart: unless-stopped
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY is required}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:7700:7700"

# ==================== Volumes ====================
volumes:
  redis-data:
  uploads-data:
  meilisearch-data:

# Only the trusted supervisor and its per-plugin candidates join this network.
# No backend, database, Redis, frontend, public ports, or external egress.
networks:
  plugin-runtime:
    name: ${PLUGIN_RUNTIME_NETWORK:-myndbbs_plugin_runtime}
    internal: true
