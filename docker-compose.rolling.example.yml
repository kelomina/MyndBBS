# Reference topology for blue/green core rollouts. Keep outside the default
# compose file until OpenResty upstreams are configured to target these ports.
services:
  backend-blue:
    image: myndbbs-backend:deploy
    environment: &backend-env
      DATABASE_URL: postgresql://myndbbs:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/myndbbs?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      NODE_ENV: production
    ports: ["127.0.0.1:3201:3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
  backend-green:
    image: myndbbs-backend:deploy
    environment: *backend-env
    ports: ["127.0.0.1:3202:3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]

# OpenResty should route to exactly one backend port at a time and switch only
# after the new color is healthy. Do not expose these ports publicly.
