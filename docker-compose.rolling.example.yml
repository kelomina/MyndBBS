# Reference topology for blue/green core rollouts. GitHub Actions deploys the
# selected GHCR image; this file is never used to build on the production host.
services:
  backend-blue:
    image: ghcr.io/kelomina/myndbbs-backend:${CORE_IMAGE_TAG:-latest}
    environment: &backend-env
      DATABASE_URL: postgresql://myndbbs:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/myndbbs?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY is required}
      NODE_ENV: production
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      PLUGIN_ALLOWLIST_FILE: /app/plugin-releases/allowlist.json
      PLUGIN_GATEWAY_DNS_PREFIX: http://myndbbs-plugin-
    volumes:
      - uploads-data:/app/packages/backend/uploads
      - ${BACKEND_ENV_FILE:-/opt/myndbbs/.env}:/app/packages/backend/.env:ro
      - ${PLUGIN_DIR:-/opt/myndbbs/plugins}:/app/plugin-releases:ro
    networks: [myndbbs_default]
    ports: ["127.0.0.1:3301:3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
  backend-green:
    image: ghcr.io/kelomina/myndbbs-backend:${CORE_IMAGE_TAG:-latest}
    environment: *backend-env
    volumes:
      - uploads-data:/app/packages/backend/uploads
      - ${BACKEND_ENV_FILE:-/opt/myndbbs/.env}:/app/packages/backend/.env:ro
      - ${PLUGIN_DIR:-/opt/myndbbs/plugins}:/app/plugin-releases:ro
    networks: [myndbbs_default]
    ports: ["127.0.0.1:3302:3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]

  frontend-blue:
    image: ghcr.io/kelomina/myndbbs-frontend:${CORE_IMAGE_TAG:-latest}
    environment:
      API_URL: http://backend-blue:3001
      NODE_ENV: production
      COOKIE_SECURE: "true"
    networks: [myndbbs_default]
    ports: ["127.0.0.1:3311:3100"]
    depends_on: [backend-blue]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3100/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]

  frontend-green:
    image: ghcr.io/kelomina/myndbbs-frontend:${CORE_IMAGE_TAG:-latest}
    environment:
      API_URL: http://backend-green:3001
      NODE_ENV: production
      COOKIE_SECURE: "true"
    networks: [myndbbs_default]
    ports: ["127.0.0.1:3312:3100"]
    depends_on: [backend-green]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3100/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]

# OpenResty should route to exactly one backend port at a time and switch only
# after the new color is healthy. Do not expose these ports publicly.

volumes:
  uploads-data:
    external: true
    name: myndbbs_uploads-data

networks:
  myndbbs_default:
    external: true
    name: myndbbs_default
