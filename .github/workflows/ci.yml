name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Generate Prisma client
        run: cd packages/backend && pnpm run generate

      - name: TypeCheck backend
        run: cd packages/backend && pnpm exec tsc --noEmit

      - name: TypeCheck frontend
        run: cd packages/frontend && pnpm exec tsc --noEmit

      - name: TypeCheck shared
        run: cd packages/shared && pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm --filter frontend lint

  test-backend:
    name: Test Backend
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myndbbs_test
          POSTGRES_USER: myndbbs
          POSTGRES_PASSWORD: myndbbs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build backend
        run: pnpm --filter backend run build
        env:
          DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public

      - name: Run backend tests
        run: pnpm --filter backend test
        env:
          DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret

  test-frontend:
    name: Test Frontend
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run frontend tests
        run: pnpm --filter frontend test

  test-shared:
    name: Test Shared
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run shared tests
        run: pnpm --filter @myndbbs/shared test

  e2e-test:
    name: E2E Tests (Playwright)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myndbbs_test
          POSTGRES_USER: myndbbs
          POSTGRES_PASSWORD: myndbbs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend (E2E starts it via playwright webServer)
        run: pnpm --filter backend run build
        env:
          DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public

      - name: Apply isolated E2E migrations
        run: pnpm --filter backend exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public

      - name: Seed isolated CAPTCHA E2E fixtures
        run: node scripts/qa/seed-captcha-e2e.mjs
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public

      - name: Compile shared package to CJS (runtime requires resolvable main)
        run: |
          pnpm run build:shared
          node -e "const fs=require('fs');const p='packages/shared/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.main='dist/index.js';j.types='dist/index.d.ts';fs.writeFileSync(p,JSON.stringify(j,null,2))"

      - name: Install Playwright browsers
        run: cd packages/frontend && pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        continue-on-error: true
        run: |
          set +e
          pnpm --filter frontend test:e2e 2>&1 | tee captcha-e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r file; do
              summary=$(tr '\n' ' ' < "$file" | cut -c1-1500)
              echo "::error file=$file::$summary"
            done < <(find packages/frontend/test-results -name error-context.md -type f 2>/dev/null)
            tail -n 80 captcha-e2e.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
        env:
          DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public
          E2E_DATABASE_URL: postgresql://myndbbs:myndbbs_test@localhost:5432/myndbbs_test?schema=public
          REDIS_URL: redis://localhost:6379
          E2E_USE_REAL_REDIS: 'true'
          JWT_SECRET: test-jwt-secret-e2e-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-e2e-0123456789abcdef
          TEMP_TOKEN_SECRET: test-temp-token-secret-e2e-0123456789abcdef0123456789

      - name: Upload CAPTCHA E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captcha-e2e-evidence
          if-no-files-found: warn
          path: |
            captcha-e2e.log
            packages/frontend/test-results/**
            packages/frontend/reports/playwright-artifacts/**
            packages/frontend/reports/playwright-html/**

      - name: Enforce E2E gate
        if: always()
        run: test "${{ steps.e2e.outcome }}" = success
