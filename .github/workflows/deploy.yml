name: Deploy

# GHCR 拉取式部署：镜像由 Docker Publish workflow 构建并推送至 ghcr.io，
# 本 workflow 在服务器上执行 compose pull + 滚动更新，含备份、健康检查与自动回滚。
#
# 所需仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets:
#     DEPLOY_SSH_KEY       服务器 SSH 私钥（myndops 用户的 key，需有 sudo -n docker 权限）
#     DISCORD_WEBHOOK_URL  （可选）部署结果通知
#   Variables:
#     DEPLOY_SSH_HOST      默认 8.148.210.186
#     DEPLOY_SSH_PORT      默认 2207
#     DEPLOY_USER          默认 myndops
#     DEPLOY_DIR           默认 /opt/myndbbs

on:
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Rollback to previous image set'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: ${{ vars.DEPLOY_SSH_HOST || '8.148.210.186' }}
  SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '2207' }}
  SSH_USER: ${{ vars.DEPLOY_USER || 'myndops' }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/myndbbs' }}
  PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL || 'https://kolobbs.kolostudio.fun' }}
  BACKEND_IMAGE: ghcr.io/kelomina/myndbbs-backend
  FRONTEND_IMAGE: ghcr.io/kelomina/myndbbs-frontend

jobs:
  deploy:
    name: Pull & Rollout (or Rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Backup DB and record current images, then pull & rollout
        if: ${{ github.event.inputs.rollback != 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,DEPLOY_DIR
          script_stop: true
          script: |
            cd "$DEPLOY_DIR"

            # ── 备份：DB dump + 当前镜像 ID（回滚锚点）──
            BK="$DEPLOY_DIR/backup/$(date +%Y%m%d-%H%M%S)-auto"
            mkdir -p "$BK"
            docker compose exec -T postgres pg_dump -U myndbbs myndbbs | gzip > "$BK/db_dump.sql.gz"
            docker images --format '{{.ID}}' $BACKEND_IMAGE:latest  | head -1 > "$BK/backend_image_id"
            docker images --format '{{.ID}}' $FRONTEND_IMAGE:latest | head -1 > "$BK/frontend_image_id"
            cp docker-compose.yml "$BK/"
            echo "[backup] -> $BK ($(cat "$BK/backend_image_id") / $(cat "$BK/frontend_image_id"))"

            # ── 拉取并滚动更新（数据库迁移由 backend entrypoint 的 prisma migrate deploy 安全执行）──
            docker compose pull backend frontend
            docker compose up -d backend frontend

      - name: Health check
        id: health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,PUBLIC_URL,BACKEND_IMAGE,FRONTEND_IMAGE
          script_stop: false
          script: |
            sleep 18
            cd "$DEPLOY_DIR"
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health || echo 000)
            SITE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL" --max-time 20 || echo 000)
            UNHEALTHY=$(docker compose ps --format json | jq -s '[.[] | select(.Health == "unhealthy" or .State == "exited")] | length')
            echo "backend=$HEALTH site=$SITE unhealthy_containers=$UNHEALTHY"
            if [ "$HEALTH" != "200" ] || [ "$SITE" != "200" ] || [ "$UNHEALTHY" != "0" ]; then
              exit 1
            fi

      - name: Rollback on failed health check
        if: ${{ github.event.inputs.rollback == 'true' || steps.health.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,BACKEND_IMAGE,FRONTEND_IMAGE
          script_stop: true
          script: |
            cd "$DEPLOY_DIR"
            BK=$(ls -td "$DEPLOY_DIR"/backup/*-auto 2>/dev/null | head -1)
            if [ -z "$BK" ]; then echo "ERROR: no auto backup found"; exit 1; fi
            echo "[rollback] restoring image ids from $BK"
            docker tag "$(cat "$BK/backend_image_id")"  $BACKEND_IMAGE:latest
            docker tag "$(cat "$BK/frontend_image_id")" $FRONTEND_IMAGE:latest
            docker compose up -d backend frontend
            sleep 15
            docker compose ps
            echo "Rollback complete. DB dump available at $BK/db_dump.sql.gz (manual restore only)"

      - name: Notify deployment success
        if: ${{ success() && github.event.inputs.rollback != 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -X POST -H "Content-Type: application/json" \
            -d '{"content": "✅ Production deployed from GHCR (pull-based)"}' \
            "$DISCORD_WEBHOOK_URL" || true

      - name: Notify rollback happened
        if: ${{ failure() || github.event.inputs.rollback == 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -X POST -H "Content-Type: application/json" \
            -d '{"content": "↩️ Production rolled back to previous images. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$DISCORD_WEBHOOK_URL" || true
